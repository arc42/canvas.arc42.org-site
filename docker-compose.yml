services:
  jekyll:
    build: .
    image: canvas-arc42-site:latest
    init: true
    environment:
      JEKYLL_ENV: development
      POLLING: "--force_polling"
    volumes:
      - .:/site
      - jekyll_cache:/site/.jekyll-cache
      - sass_cache:/site/.sass-cache
    # 4044 is this site's fixed dev port (see raw/port-assignment.md in
    # meta.arc42.org). --port is passed to Jekyll as well as mapped, so the
    # "Server address:" banner it prints on startup names the real port.
    ports:
      - '4044:4044'
    # No --incremental: full rebuild on change. Incremental silently
    # leaves stale/relocated output when permalinks or front matter change.
    command: >
      sh -c "bundle exec jekyll serve --host 0.0.0.0 --port 4044 --watch $${POLLING}"

volumes:
  jekyll_cache:
  sass_cache:
